# kwp-ds-v2 at 784 px, 20 epochs (cosine over 20): the high-res counterpart of
# train_kwp_v2_capped_nopith.yaml (320 px, 40 ep), run in parallel on the same GPU because the
# 320 run is data-loading bound (~28% util). 20 epochs because the v1 784 40-ep run plateaued on
# val from epoch ~27 and the 16-ep run was already within 0.03 test knot. Compare on test log 10
# with kwp-v1-capped-nopith-784-40ep (fg 0.778, knot 0.585, wood 0.972, pith median 4.27 px).
# train_eval every 10 epochs (a full train-eval costs ~25 min at 784); log 2 probe is cheap.

dataset_version: kwp-ds-v2

num_classes: 3
lr: 0.0001
num_epochs: 20
resolution: [784, 784]
backbone_weights: /home/jovyan/work/ctlog-eval/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
checkpoint_path: /home/jovyan/work/ctlog-eval/ckpt/kwp_v2_capped_nopith_784_20ep.pth

window: 1
n_layers: 4
pith_radius: 3

pith_regression: true
pith_loss_weight: 1.0

train_logs:
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/2
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/3
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/05
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/06
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/08
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/09
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/13
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/14
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/15
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/16
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/17
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/18
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/19
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/20
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/21
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/23
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/24
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/25
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/26
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/27
val_logs:
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/1
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/4
test_logs:
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/10
train_probe_logs:
  - /home/jovyan/work/ctlog-eval/data/kwp_ds_v2/2

batch_size: 8
num_workers: 0

distribution_loss_weight: 0.4
district_loss_weight: 0.6
focal_alpha: 2.0
focal_gamma: 5.0
tversky_alpha: 0.3
tversky_beta: 0.7
ignore_background_in_tversky: true

class_weighting: capped_inverse_frequency
class_weight_power: 1.0
class_weight_floor_share: 0.01
class_pixel_counts: [3226729598, 388031918, 5227266]

lr_schedule: cosine

log_interval: 200
train_eval_interval: 10

resume: true

use_local_logger: true
local_log_dir: /home/jovyan/work/ctlog-eval/logs/kwp_v2_capped_nopith_784_20ep
use_mlflow: true
mlflow_experiment_name: ct-log-kwp-v1
mlflow_run_name: kwp-v2-capped-nopith-784-20ep
mlflow_tracking_uri: https://dagshub.com/AddictionLord/ct-log.mlflow

mlflow_model_min_improvement: 0.005
local_checkpoint_dir: /home/jovyan/work/ctlog-eval/ckpt_local/kwp_v2_capped_nopith_784_20ep
local_checkpoint_keep: 5
viz_interval: 5
viz_num_frames: 4
