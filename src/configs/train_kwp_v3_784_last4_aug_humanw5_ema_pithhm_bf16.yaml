# Best recipe (v3, 784, last 4 blocks lr 3e-5, aug, human 5x with decoupled pith loss, EMA 0.9995,
# 12 ep) with the heatmap/soft-argmax pith head (L1, weight 10). Frozen v2 784 40 ep with this head:
# test log 10 pith median 1.05 px (val 0.87) vs 4.44 px for the pooled-MLP head, knot unchanged.
# Compare with kwp-v3-784-last4-aug-humanw5-ema-s1/s2 (pith 4.38 px on log 10, knot 0.672/0.669).

