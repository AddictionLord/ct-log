# Best recipe (v3, 784, last 4 blocks, aug, human 5x, EMA, heatmap pith) on the SAME human split as the
# YOLO-seg teacher yolo11n_seg_v5_val10: human logs 1, 2, 4 and the 27 human frames of 08 in training
# (899 human frames, as the teacher), log 10 for validation and test (the teacher also selected on 10).
# Question: is the student's 0.07 pooled-IoU gap to the teacher on log 10 (0.676 vs 0.745) a data
# confound (317 vs 899 human frames) or the model? Breakdown on log 10: the gap is mostly false positives
# at the edges of real knots (student knots too fat), not thin-knot recall.

