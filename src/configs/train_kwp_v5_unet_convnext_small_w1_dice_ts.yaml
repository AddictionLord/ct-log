# Queued 2026-10-09 (v5_unet_convnext_small_w1_dice_ts). ConvNeXt-S U-Net on kwp-ds-v5 (auto knots from the v4 EffV2-S + ConvNeXt-S ensemble with TTA, 0.765 on log 10), teacher split: does distilling the ensemble lift a single model?
# Common recipe: kwp-ds-v3, 800 px, soft Dice (Tversky 0.5/0.5), no class weights, focal gamma 2, human 5x
# (pith loss decoupled), EMA 0.9995, augmentation, bf16, 12 epochs, batch 6, pith as a heatmap channel.
# teacher split: train = auto logs + human 1, 2, 4, 08; val/test = 10 (comparison with YOLO11-seg). MLflow experiment: ct-log-kwp-teachersplit.

