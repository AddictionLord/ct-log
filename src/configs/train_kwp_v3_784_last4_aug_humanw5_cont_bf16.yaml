# Warm-restart continuation (12 + 12 epochs) of kwp-v3-784-last4-aug-humanw5-bf16: weights from its
# final epoch, fresh cosine at half the peak LR (head 5e-5, backbone 1.5e-5). Tests undertraining:
# 10x was on par with 5x (pooled knot -0.0012 [-0.0050, +0.0022]), 5x vs v2 aug pooled -0.0036
# [-0.0075, +0.0008]. Also: human frames keep 5x sampling for segmentation but get weight 1/5 in the
# pith loss (human_weight_applies_to_pith: false), so pith is trained ~uniformly (5x had moved val
# pith from 5.0 to 6.5 px). Compare paired with the 5x run and v2 aug via scripts/eval_per_log.py.

