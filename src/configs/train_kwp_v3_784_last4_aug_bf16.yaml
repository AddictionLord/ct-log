# kwp-ds-v3 (54 logs: v2 + 31 new auto-labelled logs, same YOLO-seg recipe; auto pith snapped to the
# darkest pixel in 5x5) with the best v2 recipe: 784 px, last 4 DINOv3 blocks at lr 3e-5, head 1e-4,
# bf16, augmentation. Train = 51 logs (all but 1/4/10; ~15.3k frames, 2.6x v2), val = human 1+4,
# test = human 10 (the only log clean for both the label generator and this model).
# 12 epochs (~23k steps, 1.5x the v2 20-epoch budget) because each epoch is 2.6x longer.
# Compare with kwp-v2-784-last4-aug-bf16 / -aug-cont-bf16 via scripts/eval_per_log.py.

dataset_version: kwp-ds-v3
backbone_bf16: true
backbone_trainable_blocks: 4
backbone_lr: 0.00003
augment: true

num_classes: 3
lr: 0.0001
num_epochs: 12
resolution: [784, 784]
backbone_weights: /home/jovyan/work/ctlog-eval/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
checkpoint_path: /home/jovyan/work/ctlog-eval/ckpt/kwp_v3_784_last4_aug_bf16.pth

window: 1
n_layers: 4
pith_radius: 3

pith_regression: true
pith_loss_weight: 1.0

