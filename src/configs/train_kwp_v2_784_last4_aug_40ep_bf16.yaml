# 40-epoch version of train_kwp_v2_784_last4_aug_bf16.yaml. 20-ep result: test knot 0.674 (no-aug 0.680),
# but the gap closed (ep 15: log-2 probe 0.700 vs val 0.659, was 0.781 vs 0.679) and val was still
# rising when cosine ended (knot 0.659 -> 0.676 ep 14 -> 19, val loss 0.1169 = lowest of all runs).
# Augmentation slows fitting, so the 20-epoch budget was likely too short.
# Best setup so far (train_kwp_v2_784_last4_lr3e5_bf16.yaml: last 4 blocks, lr 3e-5, 20 ep, bf16;
# test knot 0.680) plus training augmentation: uniform 0-360 deg rotation, horizontal flip (p 0.5),
# intensity jitter (p 0.8: gamma 0.8-1.25, contrast 0.8-1.2, brightness +-0.08, noise sigma <= 0.02).
# The pith target is rotated/flipped with the image. Train-eval runs on non-augmented train data.
# Question: the model now fits train logs much better than unseen ones (ep 15: log-2 probe 0.781 vs
# val 0.679, val loss rising from ep 9). Does augmentation close that gap and lift val/test?
# num_workers 6 now that /dev/shm is 2 GB (~100 MB shm per prefetched batch; 8+ risks the 2 GB cap).

