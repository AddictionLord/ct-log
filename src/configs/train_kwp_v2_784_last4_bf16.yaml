# kwp-ds-v2 at 784 px, 20 epochs, bf16, last 4 DINOv3 blocks (+ output norm) trainable at
# lr 1e-5, head at 1e-4. At 784 the train/val gap is small (ep 10: train-eval knot 0.670, log-2
# probe 0.655, val 0.632) and val was still rising at ep 19, so extra capacity is worth testing.
# Baseline: kwp-v2-capped-nopith-784-20ep (frozen, fp32), test knot 0.633. Same schedule/epochs.
# Fine-tuned blocks are saved next to the head as <checkpoint>.backbone.pth (not uploaded to MLflow).

dataset_version: kwp-ds-v2
backbone_bf16: true
backbone_trainable_blocks: 4
backbone_lr: 0.00001

num_classes: 3
lr: 0.0001
num_epochs: 20
resolution: [784, 784]
backbone_weights: /home/jovyan/work/ctlog-eval/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
checkpoint_path: /home/jovyan/work/ctlog-eval/ckpt/kwp_v2_784_last4_bf16.pth

window: 1
n_layers: 4
pith_radius: 3

pith_regression: true
pith_loss_weight: 1.0

