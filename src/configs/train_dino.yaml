# Training configuration for DINOv3 segmentation model

# Model parameters
num_classes: 10
model_name: "dinov3_vitl16"
backbone_weights: /mnt/D/models/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
checkpoint_path: /mnt/D/models/ct-log/seg_head_checkpoint.pth

# Training parameters
lr: 0.0001  # 1e-4
num_epochs: 50

# Data parameters
resolution: [320, 320]  # [height, width]

# Dataset configurations
train_dataset:
  path: data/processed/set_24
  batch_size: 2
  shuffle: true
  num_workers: 4

val_dataset:
  path: data/processed/set_24
  batch_size: 4
  shuffle: false
  num_workers: 4

test_dataset:
  path: data/processed/set_24
  batch_size: 4
  shuffle: false
  num_workers: 4

# Loss parameters
distribution_loss_weight: 0.4  # Weight for focal loss
district_loss_weight: 0.6      # Weight for Tversky loss
focal_alpha: 2.0
focal_gamma: 5.0

# Logging parameters
log_interval: false  # Log every N batches
compute_train_metrics: true
evaluate: false
