# Long-schedule KWP run with a label-quality-aware split.
#
# Split rationale: auto-annotated Phase2 logs are TRAIN-ONLY (noisy labels are
# acceptable for fitting, not for measuring). The three human-reviewed logs each
# take one role, so val and test are clean AND come from unseen logs — a
# per-frame split would leak correlated adjacent slices (see ann_pipeline/PHASES.md).
#
#   train = Phase2 auto logs 2,3,05,06,08,09  + human log 4
#   val   = human log 1
#   test  = human log 10
#
# Constant LR so a flat tail genuinely means "no more learning" rather than
# "LR annealed to zero". No augmentation yet: establish bias/variance first.

num_classes: 3
lr: 0.0001
num_epochs: 40
resolution: [320, 320]
backbone_weights: /mnt/D/models/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
checkpoint_path: /mnt/D/models/ct-log/kwp_v1_extended.pth

window: 1
n_layers: 4
pith_radius: 3

# Pith is regressed as (x, y), not segmented. At a 16x-downsampled output grid a
# pith blob is sub-pixel: measured ceiling IoU is 0.000 even with perfect
# features, so pith IoU was never a meaningful signal. Errors are reported in
# native 778px units, comparable to the detector's 0.97px median.
pith_regression: true
pith_loss_weight: 1.0

train_logs:
  - /mnt/D/datasets/ct_log/377328_phase2/2
  - /mnt/D/datasets/ct_log/377328_phase2/3
  - /mnt/D/datasets/ct_log/377328_phase2/05
  - /mnt/D/datasets/ct_log/377328_phase2/06
  - /mnt/D/datasets/ct_log/377328_phase2/08
  - /mnt/D/datasets/ct_log/377328_phase2/09
  - /mnt/D/datasets/ct_log/generated/13
  - /mnt/D/datasets/ct_log/generated/14
  - /mnt/D/datasets/ct_log/generated/15
  - /mnt/D/datasets/ct_log/generated/16
  - /mnt/D/datasets/ct_log/generated/17
  - /mnt/D/datasets/ct_log/generated/18
  - /mnt/D/datasets/ct_log/generated/19
  - /mnt/D/datasets/ct_log/generated/20
  - /mnt/D/datasets/ct_log/generated/21
  - /mnt/D/datasets/ct_log/generated/23
  - /mnt/D/datasets/ct_log/generated/24
  - /mnt/D/datasets/ct_log/generated/25
  - /mnt/D/datasets/ct_log/generated/26
  - /mnt/D/datasets/ct_log/generated/27
val_logs:
  - /mnt/D/datasets/ct_log/378193_human_collection/1
  - /mnt/D/datasets/ct_log/378193_human_collection/4
test_logs:
  - /mnt/D/datasets/ct_log/378193_human_collection/10

batch_size: 4
num_workers: 4

distribution_loss_weight: 0.4
district_loss_weight: 0.6
focal_alpha: 2.0
focal_gamma: 5.0
tversky_alpha: 0.3
tversky_beta: 0.7
ignore_background_in_tversky: true

# Constant LR on purpose: the goal of this run is to find where IoU plateaus.
# Any decaying schedule flattens the tail by construction and would make a
# plateau unreadable.
lr_schedule: none

log_interval: 200
train_eval_interval: 10

# Full-state checkpoint each epoch so a crash resumes from the last epoch
# instead of silently restarting at 0 and corrupting the plateau reading.
resume: true

use_local_logger: true
local_log_dir: logs/kwp_v1_extended
use_mlflow: true
mlflow_experiment_name: ct-log-kwp-v1
mlflow_run_name: null
mlflow_tracking_uri: http://localhost:5000
