# kwp-ds-v2 counterpart of the 320 px baseline kwp-v1-capped-nopith-overnight (test log 10:
# fg 0.699, knot 0.436, wood 0.961, pith median 5.61 px). Model, loss and schedule are identical;
# only the data changes: auto labels from plain YOLO-seg (yolo11n_seg_v5_val10, no propagation,
# no area/solidity filters), log 2 fully human-reviewed and in train, corrected val labels for
# logs 1/4 (v1 and v2 val numbers are not comparable; compare on test log 10, identical in both).
# class_pixel_counts are kept from v1 so the loss weights stay fixed and only the labels change.
# train_probe_logs evaluates the human-labelled train log 2 separately: train_eval vs train_probe
# = auto-vs-human label mismatch, train_probe vs val = cross-log generalisation.
# See ann_pipeline/DATASET_VERSIONS.md.

dataset_version: kwp-ds-v2

num_classes: 3
lr: 0.0001
num_epochs: 40
resolution: [320, 320]
backbone_weights: /home/jovyan/work/ctlog-eval/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
checkpoint_path: /home/jovyan/work/ctlog-eval/ckpt/kwp_v2_capped_nopith.pth

window: 1
n_layers: 4
pith_radius: 3

pith_regression: true
pith_loss_weight: 1.0

train_logs:
