# kwp-ds-v2 at 784 px, 40 epochs, frozen backbone under bf16 autocast (head, loss and optimizer
# stay fp32). bf16 measured ~5x backbone throughput on euler (20.8 vs 4.2 samples/s at 784).
# Questions: does val keep improving past 20 epochs (20-ep run: test knot 0.633, val still rising
# at ep 19), and does pith recover to the v1 784 40-ep level (4.27 px; run-to-run noise ~0.3 px)?
# Compare on test log 10 with kwp-v2-capped-nopith-784-20ep and kwp-v1-capped-nopith-784-40ep.

dataset_version: kwp-ds-v2
backbone_bf16: true

